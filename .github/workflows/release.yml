name: Release
run-name: Release ${{ inputs.channel }}
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Nightly from main, or promote the newest successful nightly to latest
        type: choice
        options: [nightly, latest]
        default: nightly
permissions:
  contents: read
# Serialize both channels together. Never cancel an active publisher.
concurrency:
  group: package-release
  cancel-in-progress: false
env:
  VARLOCK_TELEMETRY_DISABLED: "1"
  SOURCE_DIR: ${{ github.workspace }}/source
  ARTIFACT_DIR: ${{ github.workspace }}/release-package
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, prinpo-stack]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # Read this run's creation time for stable nightly versions on retry.
    outputs:
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/.github/actions/setup
        with:
          directory: tools
      - name: Clear release staging from previous jobs
        run: rm -rf "$ARTIFACT_DIR"
      - name: Resolve source and version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: bun --no-env-file tools/scripts/release/main.ts resolve
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.source }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/.github/actions/setup
        with:
          directory: source
      - uses: ./tools/.github/actions/check
        with:
          directory: source
      - name: Pack and validate the release tarball
        run: bun --no-env-file tools/scripts/release/main.ts pack
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-package/
          if-no-files-found: error
          retention-days: 90
      - name: Preparation summary
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "Validated $RELEASE_VERSION. The publish job submits this exact tarball to npm; release-package preserves its checksums and source metadata for recovery." >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package
      - name: Publish the preserved package and finish its GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Publisher uses only the prepared tarball; it never installs Stack dependencies.
          SOURCE_DIR: ${{ github.workspace }}
        run: bun --no-env-file scripts/release/main.ts publish
