services:
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - jobs-redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 1s
      timeout: 1s
      retries: 20
  workbench:
    image: ghcr.io/pontusab/workbench-standalone:latest
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - QUEUE_NAMES=utilities
    depends_on:
      redis:
        condition: service_healthy

volumes:
  jobs-redis-data:
